name: Daily Index Update (TSF-Top5)

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 台灣時間 19:00（UTC 11:00），週一至週五
  workflow_dispatch:           # 允許手動觸發 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下載程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件 (Install dependencies)
        run: |
          pip install -r requirements.txt
          pip install "curl_cffi>=0.7.0" --no-cache-dir
          python -c "from curl_cffi.requests import Session; print('✅ curl_cffi OK')"

      - name: 執行更新腳本 (Run Update)
        run: python run_daily_update.py

      - name: 存檔並推送到倉庫 (Commit and Push)
        run: |
          # 設定機器人身分
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          # 檢查是否有檔案變動
          git add data/tsf_history.csv
          git diff --cached --quiet || git commit -m "Auto-update data: $(date +'%Y/%m/%d')"
          git push
